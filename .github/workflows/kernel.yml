# The Boundary — external certification of the Lean kernel (07/09/2026)
#
# What this proves, in public and on a machine that is not ours:
#   1. the kernel tree committed here (Lean/tgl_kernel, materialized by um.py) BUILDS
#      against the pinned mathlib (lake-manifest.json), with zero errors;
#   2. every term listed in the sealed axiom report (tgl_kernel_proof_manifest.json,
#      4,699 at v331) exists and depends ONLY on {propext, Classical.choice, Quot.sound}
#      — no sorryAx, no custom axiom, no Lean.trustCompiler;
#   3. the count reproduced here equals the count the seal declares.
# NOT_FALSIFIED is still not CONFIRMED: this certifies the MATHEMATICS, never nature.
name: kernel

on:
  push:
    branches: [main]
    paths:
      - "Um (absoluto) — Grande Atrator/Lean/**"
      - ".github/workflows/kernel.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KERNEL: "Um (absoluto) — Grande Atrator/Lean/tgl_kernel"
      MANIFEST: "Um (absoluto) — Grande Atrator/Lean/tgl_kernel_proof_manifest.json"
    steps:
      - uses: actions/checkout@v4

      - name: Build the kernel (lake build, mathlib from cache)
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: "Um (absoluto) — Grande Atrator/Lean/tgl_kernel"
          use-mathlib-cache: true
          build: true
          test: false
          lint: false

      - name: Generate the audit file from the sealed axiom report
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          man = json.load(open(os.environ["MANIFEST"], encoding="utf-8"))
          ar = man["axiom_report"]
          names = sorted(ar)
          with open(os.path.join(os.environ["KERNEL"], "CIAudit.lean"), "w", encoding="utf-8") as f:
              f.write("import TGL\nimport TGLExt\n\n")
              f.write("-- generated by .github/workflows/kernel.yml from the SEALED axiom report\n")
              for n in names:
                  f.write("#print axioms %s\n" % n)
          print("terms to audit:", len(names))
          PY

      - name: Run the audit (#print axioms for every sealed term)
        shell: bash
        working-directory: ${{ env.KERNEL }}
        run: |
          lake env lean CIAudit.lean > ../ci_audit.txt 2>&1 || { echo "lake env lean FAILED"; tail -50 ../ci_audit.txt; exit 1; }
          echo "audit lines: $(wc -l < ../ci_audit.txt)"

      - name: Judge the audit against the seal (fail-closed)
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          man = json.load(open(os.environ["MANIFEST"], encoding="utf-8"))
          sealed = man["axiom_report"]
          txt = open(os.path.join(os.path.dirname(os.environ["KERNEL"]), "ci_audit.txt"), encoding="utf-8", errors="replace").read()
          TRIO = {"propext", "Classical.choice", "Quot.sound"}
          # Lean prints either "'X' depends on axioms: [a, b]" or "'X' does not depend on any axioms"
          got = {}
          for m in re.finditer(r"'([^']+)' depends on axioms: \[([^\]]*)\]", txt):
              got[m.group(1)] = [a.strip() for a in m.group(2).split(",") if a.strip()]
          for m in re.finditer(r"'([^']+)' does not depend on any axioms", txt):
              got[m.group(1)] = []
          errors = [l for l in txt.splitlines() if "error" in l.lower()]
          missing = sorted(set(sealed) - set(got))
          dirty = {k: v for k, v in got.items() if not set(v) <= TRIO}
          print("sealed terms ......", len(sealed))
          print("audited here ......", len(got))
          print("missing here ......", len(missing), missing[:5])
          print("outside the trio ..", len(dirty), list(dirty.items())[:5])
          print("lean errors .......", len(errors), errors[:3])
          ok = not missing and not dirty and not errors and len(got) >= len(sealed)
          print("VERDICT:", "KERNEL_REPRODUCED__AXIOMS_IN_THE_TRIO__COUNT_MATCHES_THE_SEAL" if ok else "FAILED")
          sys.exit(0 if ok else 1)
          PY

      - name: Keep the audit transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci_audit
          path: "Um (absoluto) — Grande Atrator/Lean/ci_audit.txt"
          if-no-files-found: ignore
